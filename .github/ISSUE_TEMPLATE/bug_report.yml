name: "Сообщить об ошибке"
description: "Если что-то не работает в игре, на сайте, форуме или в Wiki"
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! Опиши проблему так, чтобы её можно было воспроизвести. Не публикуй пароли, токены, базы игроков или приватные логи.
  - type: dropdown
    id: component
    attributes:
      label: "Где обнаружена ошибка?"
      options:
        - "Игровой мод (Pawn / open.mp)"
        - "Сайт"
        - "Форум"
        - "База знаний (Wiki)"
        - "GitHub Actions / сборка"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Что произошло?"
      placeholder: "Опиши фактическое поведение и текст ошибки"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Как воспроизвести?"
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Получить ошибку ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Как должно работать?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Версия / коммит / окружение"
      placeholder: "Например: ветка main, PHP 8.2, Windows 11"
  - type: textarea
    id: evidence
    attributes:
      label: "Дополнительные сведения"
      description: "Логи без секретов, скриншоты, сведения о сервере"
  - type: checkboxes
    id: checklist
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я проверил, что похожую ошибку ещё не описывали"
          required: true
        - label: "В сообщении нет ключей, паролей и персональных данных"
          required: true
