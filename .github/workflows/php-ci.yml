name: PHP validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository layout and private paths
        run: bash tests/repository.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null
          done < <(find 'Сайт' 'Форум' 'Вики' 'tests' -type f -name '*.php' -print0)
      - name: Storage integrity and session regression tests
        run: bash tests/regression.sh
      - name: Installation and HTTP smoke tests
        run: bash tests/smoke.sh
